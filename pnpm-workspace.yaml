packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  agent-browser: true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - hono@4.12.30
  - tsx@4.23.1
onlyBuiltDependencies:
  - puppeteer
  - sharp
  - unrs-resolver
